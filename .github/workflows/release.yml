# The player downloads: BeamNG.Earth-<VERSION>-x86_64.AppImage (Linux) and BeamNG.Earth-<VERSION>.exe (Windows),
# each the launcher (launcher.py: the mod, the world server, the game started for you) with Python inside.
# Every push to main tests, builds and publishes a unique commit build, without a VERSION bump.
# Manual runs build artifacts only unless publication is explicitly selected.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this commit build as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A branch-wide group silently replaces pending pushes. Each run must get its own build.
  group: release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          v="$base-build.$GITHUB_RUN_NUMBER.g${GITHUB_SHA:0:12}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Build $v from $GITHUB_SHA, publish: $PUBLISH"

  linux:
    needs: [check, tests]
    runs-on: ubuntu-22.04          # an older glibc: the AppImage runs on more distributions
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Embed commit build version
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
        run: printf '%s\n' "$BUILD_VERSION" > VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake
      - name: Rust kernels and native audio
        run: python tools/build_native.py
      - name: Grass patch (tools/gcpatch)
        run: sh tools/gcpatch/build.sh
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      - name: appimagetool
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mv appimagetool appimagetool.AppImage
      - name: Build the AppImage
        run: python tools/build_app.py --appimagetool "$PWD/appimagetool.AppImage"
      - name: Package the matching BeamMP plugin and mod
        run: python tools/package.py --beammp
      - uses: actions/upload-artifact@v4
        with:
          name: beammp
          path: dist/BeamNG.Earth-BeamMP-Server-*.zip
          if-no-files-found: error
      - name: Smoke test (the packaged server starts and answers --help)
        run: |
          f=$(ls dist/*.AppImage)
          "$f" --appimage-extract-and-run --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: [check, tests]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Embed commit build version
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
        run: Set-Content -LiteralPath VERSION -Value $env:BUILD_VERSION -Encoding utf8NoBOM
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CMake for bundled Opus
        run: python -m pip install cmake
      - name: Rust kernels and native audio
        run: python tools/build_native.py
      - name: Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      # PyInstaller's bootloader compiled here (MSVC) instead of the wheel's prebuilt one that antivirus heuristics
      # know (VirusTotal 2026-10-17: 2/60 on 1.4.35); build_app.py stops without it
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the .exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test (the packaged server starts and answers --help)
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt && head -3 help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [check, tests, linux, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish v${{ needs.check.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
        run: |
          v="$BUILD_VERSION"
          # Re-running a successful workflow never overwrites a published binary.
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already published"
            exit 0
          fi
          pre=""
          case "$v" in *preview*|*alpha*|*rc*) pre="--prerelease";; esac     # betas are full releases (the user, 2026-10-22)
          cat > notes.md <<EOF
          **Download** the file for your system, run it, and it does the rest: it installs the mod into BeamNG.drive,
          starts the world server and starts the game. Then pick **Freeroam > BeamNG.Earth**.

          - **Windows:** \`BeamNG.Earth-$v.exe\` (Windows may warn about an unknown app: More info > Run anyway)
          - **Linux:** \`BeamNG.Earth-$v-x86_64.AppImage\` (make it executable: right-click > Properties, or
            \`chmod +x\`). It starts the native game with the grass patch, no Steam launch options needed.

          Steam must be running. Closing the game stops the server. See the README for details.

          Built from commit $GITHUB_SHA by workflow run $GITHUB_RUN_NUMBER.
          EOF
          for platform in linux windows beammp; do
            (cd "out/$platform" && sha256sum *)
          done > SHA256SUMS.txt
          gh release create "v$v" out/linux/* out/windows/* out/beammp/* --target "$GITHUB_SHA" --title "BeamNG.Earth $v" \
            --notes-file notes.md --generate-notes --latest=false $pre SHA256SUMS.txt
          # A slower older run (or a manual branch build) must not replace the newest main build.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$head" = "$GITHUB_SHA" ] && [ -z "$pre" ]; then
            gh release edit "v$v" --latest
          fi
